name: Vérifier et construire le cours

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cours:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/verifier-export.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: cours-swiftui-site
          path: site/out
          if-no-files-found: error
          retention-days: 30
